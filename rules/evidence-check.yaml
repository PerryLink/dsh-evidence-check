# 证据清单齐备性核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"证据清单"（举证目录）的**齐备性与书证要素**：
#     每份证据是否写明名称与待证事实、是否注明来源与页码、
#     原件与复印件是否标注、取得日期与提交日期是否可解析且先后成立、
#     证据编号是否唯一、是否残留模板占位符。
#   其规范载体是**《最高人民法院关于民事诉讼证据的若干规定》（法释〔2019〕19号）**、
#   **《中华人民共和国民事诉讼法》**与**《中华人民共和国行政诉讼法》**等。
#   ⚠️ **法释〔2019〕19号全文已逐字核对**（六部分一百条，**来源为最高人民法院官网**
#   <https://www.court.gov.cn/zixun/xiangqing/212721.html>，见 rules/evidence/clause-verification.md）：
#      · 版本事实：**2019-10-14 审判委员会第 1777 次会议通过，自 2020-05-01 起施行**；
#        系对 2001 年版的修正；**第一百条**并明确「本规定公布施行后，最高人民法院以前发布的司法解释
#        与本规定不一致的，**不再适用**」。
#      · **第十九条（本插件唯一的逐字对应条文）**：当事人应当对其提交的证据材料「**逐一分类编号**，
#        对证据材料的**来源、证明对象和内容**作**简要说明**，**签名盖章**，**注明提交日期**，
#        并依照对方当事人人数提出副本」。
#        ⇒ **"来源"（EV-002）、"证明对象"即待证事实（EV-001）、"逐一分类编号"（EV-005）、
#        "签名盖章"即举证方（EV-006）、"注明提交日期"（EV-004）都有明文**；
#        ⚠️ **但"取得日期""案号"不在本规定里**，属本机构清单口径 —— 两条规则的 note 已如实区分。
#      · **第十四条**列举电子数据包含什么、**第十五条**规定电子数据的原件与副本口径、
#        **第十一条**要求提供原件或经法院核对无异的复制件、**第五十一条**规定举证期限、
#        **第九十条**规定不能单独作为认定根据的五类证据。
#   ⚠️ **本规定只适用于民事诉讼**（首段自述依《民事诉讼法》制定）——
#   **行政、刑事程序的证据规则另有出处**，这正是本插件**证据形式清单出厂为空**的另一层理由：
#   **不能拿民事诉讼的证据种类去核对行政或刑事程序的清单**。
#   ⚠️ **本插件明确不推算举证期限**（第五十一条的天数看起来可用，但起算点是**举证通知书的送达**
#   而非取得日期，且有第五十五条五种特殊起算与中止情形、第五十四条延长程序）——
#   **拿清单上的两个日期去推举证期限必然算错**。见 evidence 报告第三节。
#   **《民事诉讼法》《行政诉讼法》《刑事诉讼法》及民诉法解释本次均未取得逐字条文**，
#   因此每条规则的 excerpt 仍写明"该条文本次未取得"（**理由不是"取不到"，而是"核对对象是台账
#   而非举证行为"**），kind 保持 derived-from-principle（封顶 warn）
#   或 institutional-configuration（封顶 info）。
#   **取得条文后必须做两件事**：把 excerpt 换成真正的逐字摘录，把 kind 升为 direct。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定证据是否具有真实性、合法性、关联性，
#   是否足以证明待证事实，是否应当被采信或排除**。
#   那是法庭经质证后依法作出的判断，也是诉讼的核心。
#   → 因此本插件只核对**清单自身的齐备与自洽**：
#     要素是否填写、日期是否可解析且先后成立、编号是否唯一、
#     是否出现"未注明待证事实"这类清单缺陷、是否残留模板占位符。
#   → **证据形式清单（forms）出厂为空**，未配置即进 skipped——
#     民事、行政、刑事程序的证据种类各不相同，**本插件不硬编码任何证据种类清单**。

plugin: dsh-evidence-check
version: "2026.1"

rules:
  - id: EV-001
    title: 每份证据应写明名称与待证事实
    severity: warn
    basis:
      document: 《最高人民法院关于民事诉讼证据的若干规定》
      number: 法释〔2019〕19号（现行版本与条号本次未核实）
      clause: 第十九条（逐一分类编号、说明来源与证明对象）、第一条
      excerpt: 当事人应当对其提交的证据材料逐一分类编号，对证据材料的来源、证明对象和内容作简要说明，签名盖章，注明提交日期，并依照对方当事人人数提出副本。
      kind: direct
      source: https://www.court.gov.cn/zixun/xiangqing/212721.html
    params:
      check:
        kind: presenceAny
        fields: [claim, exhibitName]
        fix: 补填证据名称与待证事实；本条只核对是否填写，不判断证据是否足以证明
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定，见 rules/evidence/…clause-verification-civil-evidence-rules.md）：
      **第十九条逐字要求**「对证据材料的**来源、证明对象和内容**作简要说明」——
      「证明对象」即待证事实，故"证据名称与待证事实"两栏**是条文的直接要求在台账上的落点**。
      证据清单的**最小可核对单位**是"某份证据用来证明某一事实"：
      缺其一，清单就无法说明举证意图，质证与认证也无从展开。
      本次未取得明文条号，故封顶 warn。
      本条只核对"至少填了一个"，**不判断该证据是否足以证明该事实**——
      那需要经质证后由法庭判断。

  - id: EV-002
    title: 每份证据应注明来源
    severity: warn
    basis:
      document: 《最高人民法院关于民事诉讼证据的若干规定》
      number: 法释〔2019〕19号（现行版本与条号本次未核实）
      clause: 第十九条（对证据材料的来源……作简要说明）、第十一条（原件或者原物）
      excerpt: 当事人应当对其提交的证据材料逐一分类编号，对证据材料的来源、证明对象和内容作简要说明。……当事人向人民法院提供证据，应当提供原件或者原物。如需自己保存证据原件、原物或者提供原件、原物确有困难的，可以提供经人民法院核对无异的复制件或者复制品。
      kind: direct
      source: https://www.court.gov.cn/zixun/xiangqing/212721.html
    params:
      check:
        kind: presence
        field: source
        fix: 注明证据来源与取得方式；本条只核对是否填写，不判断来源是否合法
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定）：**第十九条**要求说明「证据材料的**来源**」，
      **第十一条**要求「提供**原件或者原物**」—— **"来源"与"原件"都是条文的直接要求**。
      来源与取得方式关系到证据能力，是清单上必须能看出来的信息。
      本次未取得明文条号，故封顶 warn。
      本条只核对来源栏是否填写，**不判断该来源是否合法、取得方式是否正当**——
      那是法庭经质证后依法判断的事项，本插件刻意不碰。

  - id: EV-003
    title: 证据形式应使用本程序口径的取值
    severity: info
    basis:
      document: 《最高人民法院关于民事诉讼证据的若干规定》
      number: 法释〔2019〕19号（自 2020 年 5 月 1 日起施行）
      clause: 第十四条（电子数据的种类）
      excerpt: 电子数据包括下列信息、电子文件：（一）网页、博客、微博客等网络平台发布的信息；（二）手机短信、电子邮件、即时通信、通讯群组等网络应用服务的通信信息；（三）用户注册信息、身份认证信息、电子交易记录、通信记录、登录日志等信息；（四）文档、图片、音频、视频、数字证书、计算机程序等电子文件；（五）其他以数字化形式存储、处理、传输的能够证明案件事实的信息。
      kind: institutional-configuration
      source: https://www.gov.cn/
    params:
      check:
        kind: enum
        field: form
        values: []
    note: >-
      ⚠️ **依据归属已于 2026-10-07 更正**：本条原先把 `document` 写作**《中华人民共和国民事诉讼法》**，
      但其 `clause`（第十四条 电子数据）**出自《最高人民法院关于民事诉讼证据的若干规定》** ——
      **两者不是同一份文件**，已把 `document` 与 `number` 一并更正。
      ⚠️ **`kind` 仍为 `institutional-configuration`**：第十四条**界定的是"电子数据"的范围**，
      **并未规定证据形式的取值清单**；`values` 出厂为空即为未配置，**取值口径属于本程序**。
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：**证据种类随程序类型与适用法律不同**——
      民事诉讼、行政诉讼、刑事诉讼列举的种类并不一致，司法解释也在不断补充；
      本插件**不硬编码任何证据种类清单**，由使用方按本案适用程序填入。
      配置示例（书证类清单）：values: [书证, 物证, 视听资料, 电子数据, 证人证言, 鉴定意见, 勘验笔录]。
      本条只核对所填值是否在册，**不判断该证据属于哪一类**——归类是法律判断。

  - id: EV-004
    title: 取得日期与提交日期应可解析且先后成立
    severity: warn
    basis:
      document: 《最高人民法院关于民事诉讼证据的若干规定》
      number: 法释〔2019〕19号（现行版本与条号本次未核实）
      clause: 第五十一条（举证期限）、第五十四条（申请延长）、第五十五条（举证期限的中止与重新确定）
      excerpt: 人民法院指定举证期限的，适用第一审普通程序审理的案件不得少于十五日，当事人提供新的证据的第二审案件不得少于十日。适用简易程序审理的案件不得超过十五日，小额诉讼案件的举证期限一般不得超过七日。……当事人申请延长举证期限的，应当在举证期限届满前向人民法院提出书面申请。
      kind: derived-from-principle
      source: https://www.court.gov.cn/zixun/xiangqing/212721.html
    params:
      check:
        kind: date
        field: obtainedAt
        notAfterField: submittedAt
        fix: 提交日期不应早于取得日期；核对两个日期的填写
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第五十一条给的是法院指定举证期限的上下限，不是"当事人应当在何时提交"的义务期限**；
      且**起算点是举证通知书的送达**（第五十条），**第五十五条另有中止与重新确定的情形**。
      ⇒ 本条只做两个日期的先后核对，**不推算举证期限**，保留 `derived-from-principle`。
      ✅ **并再次确认：不得把第五十一条的天数当作当事人的提交期限。**
      "先取得、后提交"是举证流程的**时间前提**；日期可解析是清单能被程序处理的前提。
      依据说明（据法释〔2019〕19号 **第十九条** 逐字核对，见 rules/evidence/clause-verification.md）：
      条文原文要求「对证据材料的来源、证明对象和内容作简要说明，签名盖章，**注明提交日期**」——
      ⇒ **"提交日期"有明文**；⚠️ **但"取得日期"不在本规定里**（第十一条只要求提供原件或
      经法院核对无异的复制件，**未要求标注取得日期**），该栏属**本机构清单口径**。
      本条只比较两个日期（同一天视为不晚于），**不判断是否超过举证期限**——
      举证期限由法院指定或当事人协商（第五十一条），并有中止（第五十五条）、延长（第五十四条）等规则，
      **起算点是举证通知书的送达而非取得日期**，清单里通常记不全，故本插件不推算。

  - id: EV-005
    title: 证据编号不应在清单内重复
    severity: warn
    basis:
      document: 《最高人民法院关于民事诉讼证据的若干规定》
      number: 法释〔2019〕19号（现行版本与条号本次未核实）
      clause: 第十九条（对其提交的证据材料逐一分类编号）
      excerpt: 当事人应当对其提交的证据材料逐一分类编号，对证据材料的来源、证明对象和内容作简要说明，签名盖章，注明提交日期，并依照对方当事人人数提出副本。
      kind: derived-from-principle
      source: https://www.court.gov.cn/zixun/xiangqing/212721.html
    params:
      check:
        kind: unique
        field: exhibitNo
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第十九条要求的是"逐一分类编号"**，**并未规定编号在清单内不得重复** ——
      唯一性是"每份证据只被登记一次"的**台账前提**。⇒ 保留 `derived-from-principle`。
      证据编号唯一是"每份证据只被列举一次"的**前提条件**：编号重复会让人无法在庭审中准确指认证据。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。
      命中通常意味着重复登记或编号抄错，需人工确认。

  - id: EV-006
    title: 清单应声明案号与举证方
    severity: warn
    basis:
      document: 《最高人民法院关于民事诉讼证据的若干规定》
      number: 法释〔2019〕19号（现行版本与条号本次未核实）
      clause: 第五十条（举证通知书）、第五十六条（证据交换之日举证期限届满）、第五十七条（证据交换的主持与记录）
      excerpt: 人民法院应当在审理前的准备阶段向当事人送达举证通知书。举证通知书应当载明举证责任的分配原则和要求、可以向人民法院申请调查收集证据的情形、人民法院根据案件情况指定的举证期限以及逾期提供证据的法律后果等内容。……当事人在举证期限内提供证据存在客观障碍，属于民事诉讼法第六十五条第二款规定的"当事人在该期限内提供证据确有困难"的情形。
      kind: derived-from-principle
      source: https://www.court.gov.cn/zixun/xiangqing/212721.html
    params:
      check:
        kind: headerPresence
        fields: [caseNo, party]
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第五十条要求的是法院送达举证通知书并载明若干事项**，**并未要求当事人的清单声明案号与举证方**。
      ⇒ 保留 `derived-from-principle`；`excerpt` 换为**第五十条与第五十二条第一款的逐字引文**
      （后者说明举证期限确有当事人一侧的障碍情形）。
      清单若不写明案号与举证方，就无法确定这是哪个案件、由哪一方提交的证据。
      依据说明（据法释〔2019〕19号 **第十九条** 逐字核对）：
      条文原文要求当事人「签名盖章，注明提交日期」⇒ **"举证方"（谁提交的）有明文**（签名盖章即署名）；
      ⚠️ **但"案号"不在本条里**（本规定通篇未要求清单标注案号），该栏属**本机构清单口径**。
      配置项 caseNo 对应材料顶层的案号，party 对应举证方（当事人）。

  - id: EV-007
    title: 待证事实栏不应残留未替换的占位符
    severity: warn
    basis:
      document: 《最高人民法院关于民事诉讼证据的若干规定》
      number: 法释〔2019〕19号（现行版本与条号本次未核实）
      clause: 第十九条（对证据材料的来源、证明对象和内容作简要说明）
      excerpt: 当事人应当对其提交的证据材料逐一分类编号，对证据材料的来源、证明对象和内容作简要说明，签名盖章，注明提交日期，并依照对方当事人人数提出副本。
      kind: derived-from-principle
      source: https://www.court.gov.cn/zixun/xiangqing/212721.html
    params:
      check:
        kind: containsAny
        field: claim
        terms: ['【', '】', '{{', '}}', 'XXX', 'xxx', '待填', '待补充', 'TBD', 'todo', '示例']
        fix: 待证事实应填写实际内容；残留占位符说明清单是照模板抄的
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第十九条要求"作简要说明"，但未就占位符作任何规定** ——
      本条核对的是**台账是否照抄模板**，其必要性来自说明的可信度。⇒ 保留 `derived-from-principle`。
      证据清单常由模板复制而来，待证事实栏留下【】、XXX、待填、TBD 之类占位符时，
      会让人误以为已经梳理了举证思路——**这是清单类工具最危险的失效方式**。
      本次未取得明文条号，故封顶 warn。terms 可按本机构模板调整。

disabled: []
